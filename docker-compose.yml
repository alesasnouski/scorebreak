services:
  postgres:
    image: postgres:18.1
    container_name: scorebreak_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scorebreak_dev
    ports:
      - "5432:5432"
    volumes:
      - scorebreak_postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  scorebreak_postgres_data:
